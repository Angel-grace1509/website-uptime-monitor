
{% extends "base.html" %}
{% block content %}
<h1>Add a Website</h1>
<p>Enter the name and URL of a website you want to monitor.</p>

<form action="/add" method="POST">
    <p><label for="name">Website Name</label></p>
    <input id="name" name="name"
           placeholder="Example: Google" required>

    <p><label for="url">Website URL</label></p>
    <input id="url" name="url" type="url"
           placeholder="https://www.google.com" required>

    <p><button type="submit">Add Website</button></p>
</form>
{% endblock %}
