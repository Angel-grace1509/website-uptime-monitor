
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Website Uptime Monitor</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        nav {
            background: #172554;
            padding: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        nav a:hover { text-decoration: underline; }
        main {
            max-width: 1050px;
            margin: 30px auto;
            padding: 24px;
            background: white;
            border-radius: 10px;
        }
        .cards {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 130px;
            padding: 18px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 18px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            overflow-wrap: anywhere;
        }
        input {
            width: min(100%, 400px);
            padding: 10px;
            box-sizing: border-box;
        }
        button, .button {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 10px 14px;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
        }
        .danger { background: #dc2626; }
        .UP { color: #15803d; font-weight: bold; }
        .DOWN { color: #dc2626; font-weight: bold; }
        .UNKNOWN { color: #64748b; }
        .message {
            background: #dbeafe;
            padding: 12px;
            border-radius: 6px;
        }
        .table-wrap { overflow-x: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Dashboard</a>
        <a href="/add">Add Website</a>
        <a href="/websites">Website Status</a>
        <a href="/history">Monitoring History</a>
        <a href="/check">Check All</a>
        <a href="/health">Health Status</a>
    </nav>
    <main>
        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
